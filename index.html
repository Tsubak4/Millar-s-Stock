<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Millar's Fishery - Accueil</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Roboto", sans-serif;
        color: #333;
        background-color: #1a1a1a;
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      :root {
        --fw-dark: #1a1a1a;
        --fw-darker: #0a0a0a;
        --fw-blue: #00d4ff;
        --fw-blue-dark: #0099cc;
        --fw-blue-light: #33ddff;
        --fw-beige: #ccf5ff;
        --fw-beige-dark: #99ebff;
        --fw-beige-light: #e6faff;
        --fw-gray: #333333;
        --fw-white: #ffffff;
        --fw-black: #000000;
        --fw-red: #ff4d4d;
        --fw-green: #33ff99;
      }

      /* ===== PARTICULES ===== */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--fw-blue);
        border-radius: 50%;
        opacity: 0.5;
        box-shadow: 0 0 10px var(--fw-blue);
        animation: floatUp 20s infinite linear;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% {
          transform: translateY(-100vh) translateX(100px);
          opacity: 0;
        }
      }

      /* ===== HEADER ===== */
      header {
        background: linear-gradient(135deg, var(--fw-dark) 0%, var(--fw-gray) 100%);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        padding: 1rem 0;
        border-bottom: 3px solid var(--fw-blue);
        box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        transition: all 0.3s ease;
      }

      header.scrolled {
        background: linear-gradient(
          135deg,
          rgba(26, 26, 26, 0.98) 0%,
          rgba(51, 51, 51, 0.98) 100%
        );
        box-shadow: 0 5px 25px rgba(0, 212, 255, 0.3);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 30px;
      }

      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .logo-container {
        display: flex;
        align-items: center;
        padding: 8px 15px;
        background: rgba(0, 212, 255, 0.1);
        border: 2px solid var(--fw-blue);
        border-radius: 10px;
        animation: logoGlow 2s infinite alternate;
        transition: all 0.3s ease;
      }

      @keyframes logoGlow {
        0% {
          box-shadow: 0 0 5px var(--fw-blue), 0 0 10px rgba(0, 212, 255, 0.3);
        }
        100% {
          box-shadow: 0 0 15px var(--fw-blue), 0 0 25px rgba(0, 212, 255, 0.5);
        }
      }

      .logo-container:hover {
        transform: translateY(-2px);
        border-color: var(--fw-blue-light);
      }

      .logo-icon {
        width: 2.2rem;
        height: 2.2rem;
        object-fit: contain;
        filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.6));
        transition: transform 0.3s ease;
      }

      .logo-container:hover .logo-icon {
        transform: scale(1.1) rotate(-5deg);
      }

      .logo-text-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-left: 15px;
      }

      .logo-text {
        font-family: "Orbitron", sans-serif;
        font-size: 1.8rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--fw-beige-light), var(--fw-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }

      nav {
        display: flex;
        align-items: center;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 5px;
      }

      nav a {
        text-decoration: none;
        font-family: "Orbitron", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        padding: 12px 20px;
        border-radius: 10px;
        transition: all 0.3s ease;
        border: 2px solid var(--fw-beige);
        position: relative;
        overflow: hidden;
        background: rgba(204, 245, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 90px;
      }

      .nav-icon {
        font-size: 1.2rem;
        margin-bottom: 5px;
        color: var(--fw-blue);
        display: block;
        filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5));
      }

      .nav-text {
        font-size: 0.9rem;
        display: block;
        background: linear-gradient(135deg, var(--fw-beige-light), var(--fw-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      nav a:hover {
        border: 2px solid var(--fw-blue);
        background: rgba(0, 212, 255, 0.15);
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        transform: translateY(-2px);
      }

      .burger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        background: rgba(0, 212, 255, 0.1);
        padding: 10px;
        border-radius: 10px;
        border: 2px solid var(--fw-blue);
        margin-left: 15px;
        animation: burgerGlow 2s infinite alternate;
      }

      @keyframes burgerGlow {
        0% { box-shadow: 0 0 5px var(--fw-blue), 0 0 10px rgba(0, 212, 255, 0.3); }
        100% { box-shadow: 0 0 10px var(--fw-blue), 0 0 20px rgba(0, 212, 255, 0.5); }
      }

      .burger span {
        width: 25px;
        height: 3px;
        background: var(--fw-blue);
        margin: 3px 0;
        transition: 0.3s;
        border-radius: 2px;
      }

      .burger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
      .burger.active span:nth-child(2) { opacity: 0; }
      .burger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); }

      /* ===== MAIN / HERO ===== */
      .main-content {
        flex: 1;
        padding-top: 100px;
        padding-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .main-content::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 30%),
          radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.05) 0%, transparent 30%);
        pointer-events: none;
        z-index: -1;
      }

      /* ===== LOGO HERO CENTRAL ===== */
      .hero-logo-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        padding: 20px;
      }

      .hero-logo-wrapper::before {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 212, 255, 0.25) 0%,
          rgba(0, 212, 255, 0.08) 40%,
          transparent 70%
        );
        animation: pulseGlow 3s infinite alternate;
        z-index: -1;
      }

      .hero-logo-wrapper::after {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        border: 2px solid rgba(0, 212, 255, 0.3);
        animation: rotateRing 15s linear infinite;
        z-index: -1;
      }

      @keyframes pulseGlow {
        0% { transform: scale(0.9); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 1; }
      }

      @keyframes rotateRing {
        0% { transform: rotate(0deg); border-color: rgba(0, 212, 255, 0.3); }
        50% { border-color: rgba(0, 212, 255, 0.6); }
        100% { transform: rotate(360deg); border-color: rgba(0, 212, 255, 0.3); }
      }

      .hero-logo {
        max-width: 220px;
        max-height: 220px;
        width: auto;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.7))
          drop-shadow(0 0 60px rgba(0, 212, 255, 0.4));
        animation: heroLogoFloat 4s ease-in-out infinite;
        position: relative;
        z-index: 1;
      }

      @keyframes heroLogoFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.03); }
      }

      .hero-title {
        font-family: "Orbitron", sans-serif;
        font-size: 3rem;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 4px;
        background: linear-gradient(
          to bottom,
          var(--fw-beige-light) 0%,
          var(--fw-beige) 50%,
          var(--fw-beige-dark) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        padding: 10px 0;
        animation: titleGlow 2s infinite alternate;
      }

      @keyframes titleGlow {
        0% {
          text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.5);
        }
        100% {
          text-shadow: 0 0 15px rgba(0, 212, 255, 0.9), 0 0 25px rgba(0, 212, 255, 0.6);
        }
      }

      .title-bar {
        width: 60%;
        max-width: 500px;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--fw-blue), transparent);
        margin: 10px auto 20px auto;
        border-radius: 2px;
        animation: titleBarGlow 2s infinite alternate;
      }

      @keyframes titleBarGlow {
        0% { box-shadow: 0 0 5px var(--fw-blue), 0 0 10px rgba(0, 212, 255, 0.3); }
        100% { box-shadow: 0 0 15px var(--fw-blue), 0 0 25px rgba(0, 212, 255, 0.5); }
      }

      .hero-subtitle {
        font-family: "Roboto", sans-serif;
        font-size: 1.1rem;
        color: var(--fw-beige);
        max-width: 650px;
        margin: 0 auto;
        line-height: 1.6;
        opacity: 0.9;
        padding: 0 20px;
      }

      /* ===== FOOTER ===== */
      footer {
        background: linear-gradient(135deg, var(--fw-dark) 0%, var(--fw-gray) 100%);
        padding: 25px 0;
        border-top: 3px solid var(--fw-blue);
        text-align: center;
        position: relative;
        z-index: 2;
      }

      footer::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--fw-blue);
      }

      .footer-content {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }

      .footer-bottom {
        font-family: "Orbitron", sans-serif;
        font-size: 0.95rem;
        color: var(--fw-blue);
        font-weight: 500;
        letter-spacing: 1px;
        text-align: center;
        opacity: 0.9;
      }

      .footer-bottom a {
        color: var(--fw-blue);
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
      }

      .footer-bottom a:hover {
        color: var(--fw-beige-light);
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 1200px) {
        .container { padding: 0 20px; }
        nav a { padding: 12px 15px; min-width: 80px; }
        .nav-icon { font-size: 1.1rem; }
        .nav-text { font-size: 0.85rem; }
        .hero-title { font-size: 2.8rem; }
      }

      @media (max-width: 992px) {
        nav ul { gap: 3px; }
        nav a { padding: 10px 12px; min-width: 75px; }
        .nav-icon { font-size: 1rem; }
        .nav-text { font-size: 0.8rem; }
        .hero-title { font-size: 2.4rem; }
        .hero-logo { max-width: 180px; max-height: 180px; }
        .hero-logo-wrapper::before { width: 260px; height: 260px; }
        .hero-logo-wrapper::after { width: 220px; height: 220px; }
      }

      @media (max-width: 768px) {
        nav ul {
          display: none;
          position: fixed;
          top: 100px;
          left: 0;
          width: 100%;
          background: linear-gradient(135deg, var(--fw-dark) 0%, var(--fw-gray) 100%);
          flex-direction: column;
          padding: 20px;
          text-align: center;
          gap: 10px;
          border-top: 2px solid var(--fw-blue);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          z-index: 999;
        }

        nav ul.active { display: flex; }
        nav a {
          padding: 15px;
          min-width: auto;
          width: 100%;
          max-width: 300px;
          margin: 0 auto;
          flex-direction: row;
          justify-content: center;
          gap: 10px;
          border-radius: 8px;
        }
        .nav-icon { margin-bottom: 0; font-size: 1.1rem; }
        .nav-text { font-size: 0.95rem; }
        .burger { display: flex; }
        .logo-text { font-size: 1.5rem; }
        .logo-icon { width: 1.8rem; height: 1.8rem; }
        .main-content { padding-top: 90px; }
        .hero-title { font-size: 2rem; }
        .hero-subtitle { font-size: 0.95rem; }
        .hero-logo { max-width: 160px; max-height: 160px; }
        .hero-logo-wrapper { padding: 15px; margin-bottom: 15px; }
        .hero-logo-wrapper::before { width: 220px; height: 220px; }
        .hero-logo-wrapper::after { width: 180px; height: 180px; }
      }

      @media (max-width: 576px) {
        .logo-text { font-size: 1.2rem; }
        .logo-icon { width: 1.5rem; height: 1.5rem; }
        .logo-text-container { margin-left: 10px; }
        .hero-title { font-size: 1.6rem; letter-spacing: 2px; }
        .hero-subtitle { font-size: 0.9rem; }
        .hero-logo { max-width: 140px; max-height: 140px; }
        .hero-logo-wrapper::before { width: 180px; height: 180px; }
        .hero-logo-wrapper::after { width: 150px; height: 150px; }
      }
    </style>
  </head>

  <body>
    <div class="particles" id="particles"></div>

    <header id="header">
      <div class="container">
        <div class="nav-container">
          <div class="logo-container">
            <img src="assets/Logo.png" alt="Millar's Fishery" class="logo-icon" />
            <div class="logo-text-container">
              <div class="logo-text">MILLAR'S FISHERY</div>
            </div>
          </div>

          <nav>
            <ul id="nav-menu">
              <li>
                <a href="index.html">
                  <span class="nav-icon"><i class="fas fa-home"></i></span>
                  <span class="nav-text">Accueil</span>
                </a>
              </li>
              <li>
                <a href="rachat.html">
                  <span class="nav-icon"><i class="fas fa-hand-holding-usd"></i></span>
                  <span class="nav-text">Rachat</span>
                </a>
              </li>
              <li>
                <a href="recolteur.html">
                  <span class="nav-icon"><i class="fas fa-shopping-basket"></i></span>
                  <span class="nav-text">Récolteur</span>
                </a>
              </li>
              <li>
                <a href="preparateur.html">
                  <span class="nav-icon"><i class="fas fa-utensils"></i></span>
                  <span class="nav-text">Préparateur</span>
                </a>
              </li>
            </ul>

            <div class="burger" id="burger">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="hero-logo-wrapper">
        <img src="assets/Logo.png" alt="Millar's Fishery" class="hero-logo" />
      </div>

      <div class="title-bar"></div>
      <p class="hero-subtitle">
        Bienvenue sur le portail officiel de la pêcherie Millar's Fishery.
        Gérez vos rachats, votre récolte d'appâts et vos préparations en toute simplicité.
      </p>
    </main>

    <footer>
      <div class="container">
        <div class="footer-content">
          <div class="footer-bottom">
            © 2026 <strong>Millar's Fishery FlashFA</strong> —
            <a href="droits.html">Mentions légales</a>
          </div>
        </div>
      </div>
    </footer>

    <script>
      function createParticles() {
        const container = document.getElementById("particles");
        if (!container) return;
        container.innerHTML = "";
        for (let i = 0; i < 50; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "%";
          p.style.animationDelay = Math.random() * 20 + "s";
          p.style.animationDuration = 15 + Math.random() * 10 + "s";
          container.appendChild(p);
        }
      }
      createParticles();

      const header = document.getElementById("header");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 50) header.classList.add("scrolled");
        else header.classList.remove("scrolled");
      });

      const burger = document.getElementById("burger");
      const navMenu = document.getElementById("nav-menu");
      burger.addEventListener("click", () => {
        navMenu.classList.toggle("active");
        burger.classList.toggle("active");
      });
      document.querySelectorAll("#nav-menu a").forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
          burger.classList.remove("active");
        });
      });
    </script>
  </body>
</html>
